[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "timingtask"
version = "0.1.0"
description = "The cue-triggered lick-timing task: trial generation, agents, and their training"
requires-python = ">=3.10"
# ---------------------------------------------------------------------------
# CORE dependencies.
#
# This package trains agents; it does not analyse them. It therefore depends on
# nothing from the geometry side, and deliberately so: the two repositories meet
# at the Trajectory HDF5 file written by timingtask.export, not at an import.
#
# numpy is pinned < 2 only so that this package can be installed into the SAME
# environment as neuralgeom, which pins it for geomstats/ripser. Nothing here
# needs the pin on its own account; if you ever install timingtask alone, the
# upper bound can go.
#
# h5py is core because export.py is core -- writing the trajectory is the whole
# point of training the agent, not an optional extra.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.23,<2",
    "torch>=2.0",
    "h5py>=3.7",
]

[project.optional-dependencies]
# The diagnostic figures (timingtask.plots) and the PCA in the state plots.
plots = ["matplotlib>=3.6", "scikit-learn>=1.3"]
# The gymnasium wrapper (timingtask.env). The task itself does not need gym --
# generator.py is a plain state machine and rl.py drives it directly.
gym = ["gymnasium>=1.0"]
# Everything.
full = ["matplotlib>=3.6", "scikit-learn>=1.3", "gymnasium>=1.0"]

[tool.setuptools.packages.find]
include = ["timingtask*"]

[tool.pytest.ini_options]
markers = [
    "slow: trains a network; deselect with -m 'not slow'",
]
