[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "timingtask"
version = "0.2.0"
description = "A cue-triggered lick-timing task for recurrent agents: trial generation, gymnasium environment, training and export"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23,<2",
    "torch>=2.0",
    "h5py>=3.7",
]

[project.optional-dependencies]
# Diagnostic figures (timingtask.plots).
plots = ["matplotlib>=3.6", "scikit-learn>=1.3"]
# gymnasium environment (timingtask.env).
gym = ["gymnasium>=1.0"]
full = ["matplotlib>=3.6", "scikit-learn>=1.3", "gymnasium>=1.0"]

[tool.setuptools.packages.find]
include = ["timingtask*"]

[tool.pytest.ini_options]
markers = [
    "slow: trains a network; deselect with -m 'not slow'",
]
